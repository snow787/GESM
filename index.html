<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GESM News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --ease: cubic-bezier(.4,0,.2,1);
  }

  html[data-theme="dark"] {
    --bg: #0b0e14;
    --surface: #131826;
    --surface-2: #1a2032;
    --text: #e8ecf4;
    --muted: #8891a6;
    --border: rgba(232,236,244,0.09);
    --border-strong: rgba(232,236,244,0.18);
    --accent-blue: #3b82f6;
    --accent-yellow: #fbbf24;
    --accent-orange: #fb7c3c;
    --grad-end: #ffffff;
    --shadow: 0 20px 50px rgba(0,0,0,0.45);
  }

  html[data-theme="light"] {
    --bg: #faf7f0;
    --surface: #ffffff;
    --surface-2: #f1ece0;
    --text: #1a1f2b;
    --muted: #6b7280;
    --border: rgba(26,31,43,0.09);
    --border-strong: rgba(26,31,43,0.18);
    --accent-blue: #2563eb;
    --accent-yellow: #d97706;
    --accent-orange: #ea580c;
    --grad-end: #1a1f2b;
    --shadow: 0 20px 50px rgba(26,31,43,0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    transition: background-color .5s var(--ease), color .5s var(--ease);
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  /* ---------- Header ---------- */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px);
    transition: background-color .5s var(--ease), border-color .5s var(--ease);
  }

  .header-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 1.5rem 2rem 1rem;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 1rem;
  }

  .masthead { text-align: center; }

  .masthead-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(2.1rem, 5vw, 3.4rem);
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent-blue), var(--accent-yellow), var(--accent-orange), var(--grad-end), var(--accent-blue));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradientShift 9s ease infinite;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .masthead-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: .72rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: .35rem;
  }

  .edition-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: .75rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: .5rem;
    white-space: nowrap;
  }

  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-orange);
    box-shadow: 0 0 0 0 rgba(251,124,60,.6);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(251,124,60,.5); }
    70% { box-shadow: 0 0 0 6px rgba(251,124,60,0); }
    100% { box-shadow: 0 0 0 0 rgba(251,124,60,0); }
  }

  /* ---------- Theme toggle ---------- */
  .theme-toggle {
    justify-self: start;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }

  .toggle-track {
    width: 52px;
    height: 28px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    padding: 3px;
    transition: background-color .5s var(--ease), border-color .5s var(--ease);
  }

  .toggle-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-orange));
    position: relative;
    transition: transform .45s var(--ease);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  html[data-theme="light"] .toggle-thumb { transform: translateX(24px); }

  .toggle-thumb svg {
    position: absolute;
    width: 12px;
    height: 12px;
    color: #fff;
    transition: opacity .35s var(--ease), transform .5s var(--ease);
  }

  .icon-moon { opacity: 1; transform: rotate(0deg); }
  .icon-sun { opacity: 0; transform: rotate(-90deg); }
  html[data-theme="light"] .icon-moon { opacity: 0; transform: rotate(90deg); }
  html[data-theme="light"] .icon-sun { opacity: 1; transform: rotate(0deg); }

  /* ---------- Topic nav ---------- */
  .topic-nav {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    gap: .5rem;
    overflow-x: auto;
    padding: 0 2rem 1.1rem;
    scrollbar-width: none;
  }
  .topic-nav::-webkit-scrollbar { display: none; }

  .topic-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: .78rem;
    letter-spacing: .02em;
    padding: .5rem 1.05rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: background-color .35s var(--ease), color .35s var(--ease), border-color .35s var(--ease);
  }

  .topic-pill:hover { border-color: var(--border-strong); color: var(--text); }

  .topic-pill.active {
    background: linear-gradient(90deg, var(--accent-blue), var(--accent-orange));
    color: #fff;
    border-color: transparent;
  }

  /* ---------- Main / grid ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 2.5rem 2rem 5rem;
  }

  .fade-in { animation: fadeIn .5s var(--ease); }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hidden { display: none !important; }

  .hero-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: clamp(1.75rem, 4vw, 3rem);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    margin-bottom: 2.5rem;
    transition: background-color .5s var(--ease), border-color .5s var(--ease), transform .3s var(--ease);
  }
  .hero-card:hover { transform: translateY(-3px); }

  .hero-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--accent-blue), var(--accent-yellow), var(--accent-orange));
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: .72rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent-orange);
    font-weight: 500;
  }

  .hero-headline {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 3.6vw, 2.7rem);
    line-height: 1.08;
    margin: .6rem 0 .8rem;
    max-width: 34ch;
  }

  .hero-dek {
    color: var(--muted);
    font-size: 1.02rem;
    max-width: 52ch;
    line-height: 1.55;
  }

  .card-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: .72rem;
    color: var(--muted);
    margin-top: 1.1rem;
    display: flex;
    gap: .6rem;
  }

  .sections-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 2rem;
  }

  .section-header {
    font-family: 'JetBrains Mono', monospace;
    font-size: .74rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent-blue);
    border-bottom: 1px solid var(--border);
    padding-bottom: .6rem;
    margin-bottom: 1rem;
    transition: border-color .5s var(--ease);
  }

  .card-list { display: flex; flex-direction: column; gap: .9rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 1.1rem 1.2rem;
    cursor: pointer;
    transition: background-color .5s var(--ease), border-color .35s var(--ease), transform .25s var(--ease), box-shadow .25s var(--ease);
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent-blue);
    box-shadow: var(--shadow);
  }

  .card-headline {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.05rem;
    line-height: 1.3;
    margin: .35rem 0 .3rem;
  }

  .card-dek {
    color: var(--muted);
    font-size: .87rem;
    line-height: 1.45;
  }

  /* ---------- Article view ---------- */
  .article-view { max-width: 700px; margin: 0 auto; }

  .back-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: .8rem;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: .5rem 1rem;
    cursor: pointer;
    margin-bottom: 2rem;
    transition: color .3s var(--ease), border-color .3s var(--ease);
  }
  .back-btn:hover { color: var(--text); border-color: var(--border-strong); }

  .article-headline {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(2rem, 5vw, 2.9rem);
    line-height: 1.08;
    margin: .7rem 0 1rem;
  }

  .article-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: .78rem;
    color: var(--muted);
    display: flex;
    gap: .8rem;
    padding-bottom: 1.6rem;
    margin-bottom: 1.6rem;
    border-bottom: 1px solid var(--border);
  }

  .article-body p {
    line-height: 1.75;
    font-size: 1.03rem;
    margin-bottom: 1.2rem;
  }

  .tips-list {
    background: var(--surface-2);
    border-left: 4px solid var(--accent-orange);
    border-radius: var(--radius-sm);
    padding: 1.3rem 1.5rem;
    margin: 1.6rem 0;
    transition: background-color .5s var(--ease);
  }

  .tips-list p {
    font-family: 'JetBrains Mono', monospace;
    font-size: .72rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent-orange);
    margin-bottom: .7rem;
  }

  .tips-list ul { list-style: none; display: flex; flex-direction: column; gap: .55rem; }
  .tips-list li {
    font-size: .95rem;
    line-height: 1.5;
    padding-left: 1.4rem;
    position: relative;
  }
  .tips-list li::before {
    content: "→";
    position: absolute;
    left: 0;
    color: var(--accent-blue);
  }

  footer {
    text-align: center;
    padding: 3rem 2rem 3.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: .75rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    transition: border-color .5s var(--ease);
  }

  :focus-visible {
    outline: 2px solid var(--accent-blue);
    outline-offset: 2px;
  }

  @media (max-width: 640px) {
    .header-inner { grid-template-columns: auto 1fr; }
    .edition-meta { display: none; }
    main { padding: 2rem 1.2rem 4rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .masthead-title { animation: none; background-position: 30% 50%; }
    .live-dot { animation: none; }
    * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark and light mode">
      <span class="toggle-track">
        <span class="toggle-thumb">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </span>
      </span>
    </button>
    <div class="masthead">
      <h1 class="masthead-title">GESM News</h1>
      <p class="masthead-tag">Student-run &middot; always developing</p>
    </div>
    <div class="edition-meta">
      <span class="live-dot"></span>
      <span id="dateDisplay"></span>
      <span>&middot;</span>
      <span>Vol. 12, No. 4</span>
    </div>
  </div>
  <nav class="topic-nav" id="topicNav"></nav>
</header>

<main>
  <section id="gridView"></section>
  <section id="articleView" class="article-view hidden"></section>
</main>

<footer>GESM News &mdash; written, edited, and argued about by students.</footer>

<script>
  // ---------- Theme ----------
  const html = document.documentElement;
  document.getElementById('themeToggle').addEventListener('click', () => {
    html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

  // ---------- Data ----------
<script>
  // ---------- Theme ----------
  const html = document.documentElement;
  document.getElementById('themeToggle').addEventListener('click', () => {
    html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

  // ---------- Global State & Fetch ----------
  let topics = [];
  let articles = [];
  let activeTopic = 'home';

  const byId = id => articles.find(a => a.id === id);

  // Load external data file
  fetch('articles.json')
    .then(response => response.json())
    .then(data => {
      topics = data.topics;
      articles = data.articles;
      
      // Initialize layout after data arrives
      renderNav();
      renderGrid('home');
    })
    .catch(error => console.error('Error loading articles:', error));

  // ---------- Nav rendering ----------
  const navEl = document.getElementById('topicNav');

  function renderNav() {
    navEl.innerHTML = topics.map(t =>
      `<button class="topic-pill ${t.id === activeTopic ? 'active' : ''}" data-topic="${t.id}">${t.name}</button>`
    ).join('');
    navEl.querySelectorAll('.topic-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTopic = btn.dataset.topic;
        renderNav();
        renderGrid(activeTopic);
        showGrid();
      });
    });
  }

  // ---------- Card templates ----------
  function heroTemplate(a) {
    return `
      <article class="hero-card fade-in" data-id="${a.id}">
        <p class="eyebrow">${a.eyebrow}</p>
        <h2 class="hero-headline">${a.headline}</h2>
        <p class="hero-dek">${a.dek}</p>
        <div class="card-meta"><span>${a.author}</span><span>&middot;</span><span>${a.read} read</span></div>
      </article>`;
  }

  function cardTemplate(a) {
    return `
      <div class="card" data-id="${a.id}">
        <p class="eyebrow">${a.eyebrow}</p>
        <h3 class="card-headline">${a.headline}</h3>
        <p class="card-dek">${a.dek}</p>
      </div>`;
  }

  function attachCardHandlers(container) {
    container.querySelectorAll('[data-id]').forEach(el => {
      el.addEventListener('click', () => {
        renderArticle(el.dataset.id);
        showArticle();
      });
    });
  }

  // ---------- Grid rendering ----------
  function renderGrid(topicId) {
    const gridEl = document.getElementById('gridView');
    let hero, sections;

    if (topicId === 'home') {
      hero = articles.find(a => a.homeFeatured) || articles[0];
      sections = [
        { label: 'Trending Now', ids: ['sp1', 'cl1', 'vc1'] },
        { label: 'Around Campus', ids: ['bz2', 'cf1', 'cl3'] },
        { label: 'From the Homework Desk', ids: ['hw1', 'hw4', 'hw2'] },
      ].map(s => ({ label: s.label, items: s.ids.map(byId).filter(Boolean) }));
    } else {
      const topicArticles = articles.filter(a => a.topic === topicId);
      hero = topicArticles.find(a => a.featured) || topicArticles[0];
      const rest = topicArticles.filter(a => a.id !== (hero ? hero.id : null));
      const groups = {};
      rest.forEach(a => { (groups[a.eyebrow] = groups[a.eyebrow] || []).push(a); });
      sections = Object.keys(groups).map(label => ({ label, items: groups[label] }));
    }

    if (!hero) return;

    gridEl.innerHTML = heroTemplate(hero) +
      `<div class="sections-grid">` +
      sections.map(s => `
        <div class="section-block">
          <p class="section-header">${s.label}</p>
          <div class="card-list">${s.items.map(cardTemplate).join('')}</div>
        </div>`).join('') +
      `</div>`;

    attachCardHandlers(gridEl);
  }

  // ---------- Article rendering ----------
  function renderArticle(id) {
    const a = byId(id);
    const topicObj = topics.find(t => t.id === a.topic);
    const topicName = topicObj ? topicObj.name : '';
    const el = document.getElementById('articleView');
    el.innerHTML = `
      <button class="back-btn" id="backBtn">&larr; Back to ${activeTopic === 'home' ? 'Home' : topicName}</button>
      <p class="eyebrow">${a.eyebrow}</p>
      <h1 class="article-headline">${a.headline}</h1>
      <div class="article-meta"><span>${a.author}</span><span>&middot;</span><span>${a.read} read</span><span>&middot;</span><span>${topicName}</span></div>
      <div class="article-body">
        ${a.body.map(p => `<p>${p}</p>`).join('')}
        ${a.tips ? `<div class="tips-list"><p>Quick tips</p><ul>${a.tips.map(t => `<li>${t}</li>`).join('')}</ul></div>` : ''}
      </div>`;
    document.getElementById('backBtn').addEventListener('click', showGrid);
  }

  function showGrid() {
    document.getElementById('gridView').classList.remove('hidden');
    document.getElementById('articleView').classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function showArticle() {
    document.getElementById('gridView').classList.add('hidden');
    const view = document.getElementById('articleView');
    view.classList.remove('hidden');
    view.classList.add('fade-in');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
</html>
